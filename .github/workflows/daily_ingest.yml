name: Daily Environmental Ingestion

on:
  schedule:
    # Run daily at 01:00 UTC (07:00 Asia/Dhaka)
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Number of days to backfill"
        required: false
        default: "7"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Open-Meteo ingestion & risk score update
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/ingest_weather.py --days "${{ github.event.inputs.days_back || '7' }}"
